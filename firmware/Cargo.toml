[package]
name = "ttk4225-plant-watering-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "ttk4225-plant-watering-system"

[[bin]]
name = "ttk4225-plant-watering-system"
path = "src/bin/main.rs"
test = false
bench = false

[dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
esp-backtrace = { version = "0.19.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32"] }
nb = "1.1"
